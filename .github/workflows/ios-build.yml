name: iOS Build + TestFlight

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore Apple credentials
        env:
          APPLE_CREDS: ${{ secrets.APPLE_CREDS }}
        run: echo "$APPLE_CREDS" | base64 -d | tar xz

      - name: Restore Expo session
        env:
          EXPO_STATE: ${{ secrets.EXPO_STATE }}
        run: |
          mkdir -p ~/.expo
          echo "$EXPO_STATE" | base64 -d > ~/.expo/state.json

      - name: Install EAS CLI + deps
        run: |
          npm install -g eas-cli
          npm install

      - name: Check native targets
        run: node scripts/check-targets.mjs

      - name: Build iOS (local, umgeht EAS-Cloud-Kontingent)
        # Extensions per Repository-Variable scharf schalten, sobald Apple die
        # Capabilities freigegeben hat (Portal-Aktion, nicht per API möglich):
        #   vars.BLOCKPHONE_SHIELD_EXT=1      → shieldconfig + shieldaction
        #   vars.BLOCKPHONE_DEVICE_ACTIVITY=1  → deviceactivity (Zeitlimits)
        #   vars.BLOCKPHONE_APP_GROUP=1        → App Group im Entitlements
        # Ohne Variablen bleibt der Build wie Build 148 (nur DNS-Tunnel) — grün.
        env:
          CI: 1
          BLOCKPHONE_SHIELD_EXT: ${{ vars.BLOCKPHONE_SHIELD_EXT }}
          BLOCKPHONE_DEVICE_ACTIVITY: ${{ vars.BLOCKPHONE_DEVICE_ACTIVITY }}
          APP_GROUP: ${{ vars.BLOCKPHONE_APP_GROUP }}
        run: eas build --platform ios --profile production --non-interactive --local

      - name: Submit to TestFlight
        env:
          CI: 1
        run: |
          IPA=$(find . /private/var/folders -name "*.ipa" -not -path "*/node_modules/*" 2>/dev/null | head -1)
          echo "IPA gefunden: $IPA"
          if [ -z "$IPA" ]; then echo "Keine .ipa gefunden"; exit 1; fi
          eas submit --platform ios --profile production --non-interactive --path "$IPA"
