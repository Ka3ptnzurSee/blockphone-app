name: Swift-Extensions kompilieren (ohne Signatur)

# Warum: shieldconfig/shieldaction/deviceactivity werden nur mit Flags gebaut.
# Ohne diesen Job fällt ein Swift-Fehler erst im Release-Build auf dem Gerät
# auf (so passiert in Build 148: "Build kompilierte nicht").
#
# Hier wird NUR kompiliert (CODE_SIGNING_ALLOWED=NO): Entitlements/Profile
# sind egal, es geht rein um Syntax/Typen der Extension-Quellen.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "targets/**"
      - "modules/screentime-shield/**"
      - "modules/vpn-manager/**"
      - "plugins/**"
      - ".github/workflows/swift-compile-check.yml"

jobs:
  compile:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Die SPM-Pakete von RN 0.86 verlangen Swift-Tools 6.2 (Xcode 26.x).
      # Der Runner liefert mehrere Xcodes — immer die neueste nehmen, sonst
      # bricht schon die Paketauflösung ab ("package 'apple' is using Swift
      # tools version 6.2.0 but the installed version is 6.1.0").
      - name: Neueste Xcode wählen
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Gewählt: $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
          swift --version

      - name: Install deps
        run: npm install

      - name: Targets prüfen (mit allen Flags)
        env:
          BLOCKPHONE_SHIELD_EXT: "1"
          BLOCKPHONE_DEVICE_ACTIVITY: "1"
          APP_GROUP: "1"
        run: node scripts/check-targets.mjs

      - name: Prebuild mit allen Targets
        env:
          CI: 1
          BLOCKPHONE_SHIELD_EXT: "1"
          BLOCKPHONE_DEVICE_ACTIVITY: "1"
          APP_GROUP: "1"
        run: npx expo prebuild -p ios --clean --no-install

      - name: Pods installieren
        run: cd ios && pod install --repo-update


      # Die Apple-Deklarationen sind die Wahrheit: Protokoll oder Klasse?
      # (ShieldConfigurationDataSource/ShieldActionDelegate sind je nach SDK
      # unterschiedlich — dieser Schritt schreibt die echten Signaturen ins Log.)
      - name: SDK-Deklarationen (ManagedSettings*)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for f in $(find "$SDK/System/Library/Frameworks" -maxdepth 2 -name "*.swiftinterface" -path "*ManagedSettings*" 2>/dev/null); do
            echo "=== $f"
            grep -nE "(class|protocol|func handle|func configuration|open func)" "$f" | grep -iE "shield|handle\(action|configuration\(shielding" | head -40
          done

      - name: Alle Targets kompilieren (Simulator, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Blockphone.xcworkspace \
            -scheme Blockphone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/build.log | tail -80

      - name: Extensions im Build nachweisen
        if: always()
        run: |
          echo "=== kompilierte Swift-Dateien der Extensions ==="
          grep -oE "[A-Za-z]+Extension\.swift|ScreenTimeShieldModule\.swift|VpnManagerModule\.swift" /tmp/build.log | sort -u || true
          echo "=== gebaute .appex-Bundles ==="
          FOUND=$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 12 -name "*.appex" 2>/dev/null | sed 's|.*/||' | sort -u)
          echo "${FOUND:-(keine)}"
          MISSING=0
          for b in ShieldConfiguration.appex ShieldAction.appex DeviceActivityMonitor.appex PacketTunnelProvider.appex; do
            if echo "$FOUND" | grep -qx "$b"; then echo "OK $b gebaut"; else echo "FEHLT $b"; MISSING=1; fi
          done
          exit $MISSING

      # Warum dieser Schritt: Der Werbeblocker liest die Liste aus dem
      # Extension-Bundle (Bundle.main.url(forResource: "adblock")). Fehlt die
      # Datei im .appex, blockt die App NULL Domains — ohne Fehlermeldung.
      # Das laesst sich nur am gebauten Bundle pruefen, nicht am Quelltext.
      # Echte Ausfuehrungstests fuer die DNS-Logik (parse/isBlocked/envelope).
      # Die Node-Tests lesen nur den Quelltext per Regex; hier laeuft der Code
      # wirklich — inklusive IP/UDP-Checksummen, die ein Client sonst verwirft.
      - name: Tunnel-Logik ausfuehren (swift test)
        run: |
          set -o pipefail
          mkdir -p tests/swift/Sources/TunnelCore
          cp targets/packettunnel/DnsFilter.swift tests/swift/Sources/TunnelCore/
          cd tests/swift
          swift test 2>&1 | tail -50

      - name: adblock.json im PacketTunnelProvider.appex nachweisen
        run: |
          set -o pipefail
          DD="$HOME/Library/Developer/Xcode/DerivedData"
          APEX=$(find "$DD" -maxdepth 12 -name "PacketTunnelProvider.appex" -type d 2>/dev/null | head -1)
          if [ -z "$APEX" ]; then echo "FEHLT: PacketTunnelProvider.appex nicht gebaut"; exit 1; fi
          echo "appex: $APEX"
          ls -la "$APEX" | head -20
          if [ ! -f "$APEX/adblock.json" ]; then
            echo "ROT: adblock.json liegt NICHT im Extension-Bundle -> Blocker blockt 0 Domains"
            exit 1
          fi
          node -e '
            const a = require(process.argv[1]);
            if (!Array.isArray(a) || a.length < 1000) {
              console.error("ROT: Liste im Bundle unbrauchbar: " + (Array.isArray(a) ? a.length : typeof a));
              process.exit(1);
            }
            console.log("GRUEN: adblock.json im Bundle, " + a.length + " Domains, " + Math.round(JSON.stringify(a).length / 1024) + " KB");
          ' "$APEX/adblock.json"
