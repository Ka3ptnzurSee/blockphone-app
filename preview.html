<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockphone — Nothing Preview</title>
<style>
  @font-face { font-family: "Ndot57"; src: url("./assets/fonts/ndot57.otf"); }
  @font-face { font-family: "Lettera"; src: url("./assets/fonts/lettera_mono_ll_regular.otf"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000; color: #fff; font-family: "Lettera", monospace;
    width: 390px; margin: 0 auto; min-height: 100vh;
  }
  .screen { min-height: 100vh; display: flex; flex-direction: column; }
  header { text-align: center; padding: 22px 20px 12px; }
  header h1 { font-family: "Ndot57"; font-size: 26px; letter-spacing: 3px; }
  header p { font-size: 9px; letter-spacing: 4px; color: #5a5a5a; margin-top: 3px; }
  .glyph { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .ring { position: relative; width: 230px; height: 230px; margin-bottom: 6px; }
  .bar { position: absolute; top: 0; left: 112px; width: 7px; height: 69px; border-radius: 4px; background: #fff;
         transform-origin: 4px 115px; animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  .clock { font-family: "Ndot57"; font-size: 60px; letter-spacing: 4px; }
  .date { font-size: 12px; letter-spacing: 1px; color: #8a8a8a; text-transform: uppercase; }
  .hint { font-size: 11px; color: #5a5a5a; letter-spacing: 1px; margin-top: 4px; }
  .devices { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .label { font-family: "Ndot57"; font-size: 14px; letter-spacing: 3px; color: #8a8a8a; margin-bottom: 4px; }
  .card { display: flex; align-items: center; background: #141414; border: 1px solid #2a2a2a;
          border-radius: 14px; padding: 14px; gap: 10px; }
  .card .info { flex: 1; }
  .card .name { font-size: 14px; }
  .card .ip { font-family: "Ndot57"; font-size: 12px; color: #8a8a8a; margin-top: 2px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; }
  .dot.on { background: #fff; } .dot.off { background: #3a3a3a; }
  .state { font-size: 9px; letter-spacing: 1px; color: #8a8a8a; text-align: center; }
  .btn { border: 1px solid #8a8a8a; border-radius: 999px; padding: 8px 14px; font-size: 10px; letter-spacing: 1px; }
  .btn.block { background: #fff; color: #000; border-color: #fff; font-weight: 700; }
</style>
</head>
<body>
  <div class="screen">
    <header><h1>BLOCKPHONE</h1><p>NOTHING · MONOCHROME</p></header>

    <div class="glyph">
      <div class="ring" id="ring"></div>
      <div class="clock">01:28</div>
      <div class="date">Samstag, 24. Oktober</div>
      <div class="hint">Sperre &amp; Fokus — schwarz auf weiß.</div>
    </div>

    <div class="devices">
      <div class="label">GERÄTE IM NETZ</div>
      <div class="card"><div class="info"><div class="name">iphone</div><div class="ip">192.168.0.215</div></div>
        <div><div class="dot off"></div><div class="state">GESPERRT</div></div>
        <div class="btn">ENTSPERREN</div></div>
      <div class="card"><div class="info"><div class="name">ipad</div><div class="ip">192.168.0.29</div></div>
        <div><div class="dot on"></div><div class="state">ONLINE</div></div>
        <div class="btn block">SPERREN</div></div>
      <div class="card"><div class="info"><div class="name">laptop</div><div class="ip">192.168.0.88</div></div>
        <div><div class="dot on"></div><div class="state">ONLINE</div></div>
        <div class="btn block">SPERREN</div></div>
    </div>
  </div>
<script>
  const ring = document.getElementById("ring");
  for (let i = 0; i < 8; i++) {
    const b = document.createElement("div");
    b.className = "bar";
    b.style.transform = `rotate(${i * 45}deg)`;
    b.style.animationDelay = `${(i * 2.2) / 8}s`;
    ring.appendChild(b);
  }
</script>
</body>
</html>
